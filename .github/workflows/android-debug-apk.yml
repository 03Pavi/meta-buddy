name: Android debug APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/mobile
    env:
      # Optional. Without these secrets the Meta app ID and token fall back to 0 (Developer Mode values).
      MWDAT_APPLICATION_ID: ${{ secrets.MWDAT_APPLICATION_ID }}
      MWDAT_CLIENT_TOKEN: ${{ secrets.MWDAT_CLIENT_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Installs current command-line tools. The runner's preinstalled ones are too old to find android-37.
      - uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          # Accept the Android SDK license by writing its known hash, instead of answering prompts.
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-37" \
            "ndk;27.1.12297006" \
            "cmake;3.31.6"

      - name: Install JavaScript dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate the Android project from the Expo config
        run: node node_modules/expo/bin/cli prebuild --platform android --clean --no-install

      - name: Build the debug APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: buddy-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
