name: Android debug APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/mobile
    env:
      # Optional. Without these secrets the Meta app ID and token fall back to 0 (Developer Mode values).
      MWDAT_APPLICATION_ID: ${{ secrets.MWDAT_APPLICATION_ID }}
      MWDAT_CLIENT_TOKEN: ${{ secrets.MWDAT_CLIENT_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The native build needs CMake 3.31.6 and Ninja. Gradle looks for them on the PATH, so install them from PyPI.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CMake and Ninja
        run: python -m pip install cmake==3.31.6 ninja

      # Accept the Android SDK license by writing its known hash. Gradle then installs the platform, NDK and CMake
      # the project asks for, so no separate sdkmanager step is needed.
      - name: Accept the Android SDK license
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$ANDROID_HOME/licenses/android-sdk-license"

      - name: Install JavaScript dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate the Android project from the Expo config
        run: node node_modules/expo/bin/cli prebuild --platform android --clean --no-install

      - name: Build the debug APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: buddy-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
